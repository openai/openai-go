name: Isolated lint profile
on:
  push:
    branches: [codegen/apcha-lint-profile-20260930]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            variant: source-400
          - runner: macos-latest
            variant: source-400
    env:
      GOTOOLCHAIN: local
      GOCACHE: ${{ github.workspace }}/.profile/build
      GOMODCACHE: ${{ github.workspace }}/.profile/mod
      GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.profile/analysis
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          ref: 066a4e2837d1982baa58933875b09cbb2b33038a
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: Profile cold warm and changed SDK
        shell: bash
        run: |
          git rev-parse HEAD
          if [ "$(uname -s)" = Linux ]; then
            lscpu | head -30
            free -m
          else
            sysctl hw.logicalcpu hw.memsize machdep.cpu.brand_string
          fi
          go version
          python3 -u - <<'PY'
          import os, subprocess, time, json
          from pathlib import Path
          root = Path.cwd()
          config = str(root / '.golangci.yml')
          variant = os.environ['VARIANT']
          native_goos = subprocess.check_output(['go','env','GOOS'],text=True).strip()
          env = dict(os.environ, GOGC=variant.split('-')[1], GOMEMLIMIT='4GiB')
          def timed(label, cmd, cwd=root, extra=None, capture=False):
              print('START', label, flush=True)
              start = time.monotonic()
              result = subprocess.run(cmd, cwd=cwd, env=env | (extra or {}), stdout=subprocess.PIPE if capture else None, text=True)
              print('TIMING', json.dumps({'label': label, 'seconds': round(time.monotonic()-start,3), 'exit': result.returncode}), flush=True)
              result.check_returncode()
              return result.stdout
          workspace = Path(os.environ['RUNNER_TEMP'])/'go.work'
          if variant.startswith('workspace'):
              timed('workspace-init',['go','work','init',str(root),str(root/'examples'),str(root/'internal/testdata/consumer')],cwd=workspace.parent)
          for state in ['cold', 'warm', 'changed']:
              if state == 'changed':
                  (root / 'lint_cache_probe.go').write_text('package openai\n\nconst LintCacheProbe = 1\n')
              runner = timed(state+'/tool-build',['go','tool','-modfile='+str(root/'tools/go.mod'),'-n','golangci-lint'],capture=True).strip()
              timed(state+'/tools-fmt', [runner,'fmt','--config='+config,'--diff','./tools/...'])
              if variant.startswith('workspace'):
                  timed(state+'/native-workspace',[runner,'run','--config='+config,'--tests=true','--verbose','./...','./examples/...','./internal/testdata/consumer/...'],extra={'GOWORK':str(workspace)})
              else:
                  for module in ['.','examples','internal/testdata/consumer']:
                      timed(state+'/'+module+'/native',[runner,'run','--config='+config,'--tests=true','--verbose'],cwd=root/module)
              if native_goos == 'linux':
                  timed(state+'/windows-tts',[runner,'run','--config='+config,'--tests=true','--verbose','./audio-text-to-speech'],cwd=root/'examples',extra={'GOOS':'windows','GOARCH':'arm64','CGO_ENABLED':'0'})
          (root / 'lint_cache_probe.go').unlink()
          timed('tidy',['./scripts/check-go-mod'])
          PY
          du -sh .profile/*
