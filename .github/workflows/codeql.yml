name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  # The monthly Go version review explicitly dispatches CodeQL because its
  # GITHUB_TOKEN-created pull request requires approval before pull_request
  # workflows run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:${{ matrix.language }}

  codeql_required:
    name: CodeQL analysis (all languages)
    if: always()
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CodeQL analysis
        env:
          ANALYSIS_RESULT: ${{ needs.analyze.result }}
        run: |
          if [[ "$ANALYSIS_RESULT" != "success" ]]; then
            echo "CodeQL analysis ended with: $ANALYSIS_RESULT"
            exit 1
          fi
