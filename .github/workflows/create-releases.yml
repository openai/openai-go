name: Create releases
on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    name: release
    if: github.ref == 'refs/heads/main' && github.repository == 'openai/openai-go'
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}

    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OPENAI_SDKS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENAI_SDKS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Index Go documentation
    needs: release
    if: ${{ needs.release.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Verify released module and request documentation indexing
        run: |
          version="$(jq -er '.["."]' .release-please-manifest.json)"
          module="$(awk '$1 == "module" { print $2; exit }' go.mod)"

          # Warm the proxy and verify the version before retrying pkg.go.dev 404s.
          curl --fail-with-body --show-error --silent \
            --retry 5 --retry-all-errors --retry-delay 15 --retry-max-time 180 \
            --connect-timeout 10 --max-time 30 \
            "https://proxy.golang.org/${module}/@v/v${version}.info"

          # pkg.go.dev returns 408 after 30 seconds while indexing continues.
          # Retrying also handles a fresh version not yet visible there (404).
          if ! curl --fail-with-body --show-error --silent \
            --retry 5 --retry-all-errors --retry-delay 15 --retry-max-time 300 \
            --connect-timeout 10 --max-time 45 \
            -X POST "https://pkg.go.dev/fetch/${module}@v${version}"; then
            echo "::error::Go module ${module}@v${version} is available, but documentation indexing failed. Inspect the response above and rerun only the Index Go documentation job."
            exit 1
          fi
