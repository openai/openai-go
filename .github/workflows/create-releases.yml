name: Create releases
on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    name: release
    if: github.ref == 'refs/heads/main' && github.repository == 'openai/openai-go'
    runs-on: ubuntu-latest
    environment: release
    permissions: {}

    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OPENAI_SDKS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENAI_SDKS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Record indexing handoff
        if: steps.release.outputs.releases_created == 'true'
        run: |
          {
            echo "Release DRI: within 15 minutes of release, check that every new release tag has a matching [Index Go docs run](https://github.com/openai/openai-go/actions/workflows/index-go-docs.yml)."
            echo "If a run is missing or failed, dispatch Index Go docs on main with the exact tag and independently verified full commit SHA. Never rerun Create releases to retry indexing."
            echo "Within 60 minutes, verify that the exact released version appears on pkg.go.dev or escalate to SDK on-call if blocked upstream. Escalate immediately after one failed manual recovery."
          } >> "$GITHUB_STEP_SUMMARY"
