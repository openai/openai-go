version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - nolintlint
  exclusions:
    generated: disable
  settings:
    nolintlint:
      # A disabled analyzer cannot reliably prove whether its directive is stale.
      allow-unused: true
      require-explanation: true
      require-specific: true
